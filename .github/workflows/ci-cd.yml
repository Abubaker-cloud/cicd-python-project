name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest -v

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-python-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-python-app:latest

  deploy:
    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Latest Image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-python-app:latest

      - name: Deploy Container
        shell: pwsh
        run: |
          $existing = docker ps -aq --filter "name=^cicd-app$"

          if ($existing) {
              docker rm -f cicd-app
          }

          docker run -d --restart unless-stopped --name cicd-app -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/cicd-python-app:latest

      - name: Verify Deployment
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          curl.exe -f http://localhost:5000/health

          if ($LASTEXITCODE -ne 0) {
              docker logs cicd-app
              exit 1
          }